<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6750A4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Timer circle (outer ring) -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="url(#timerGradient)" stroke-width="24" opacity="0.3"/>
  
  <!-- Timer circle (inner ring) -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#timerGradient)" stroke-width="16" opacity="0.6"/>
  
  <!-- Timer hands/indicators -->
  <!-- Hour hand (shorter) -->
  <line x1="512" y1="512" x2="512" y2="320" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute hand (longer) -->
  <line x1="512" y1="512" x2="512" y2="240" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="512" cy="512" r="20" fill="#FFFFFF"/>
  
  <!-- Timer marks (12, 3, 6, 9 o'clock positions) -->
  <line x1="512" y1="120" x2="512" y2="160" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <line x1="904" y1="512" x2="864" y2="512" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <line x1="512" y1="904" x2="512" y2="864" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="512" x2="160" y2="512" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Small timer marks -->
  <line x1="512" y1="140" x2="512" y2="160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="884" y1="512" x2="864" y2="512" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="512" y1="884" x2="512" y2="864" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="140" y1="512" x2="160" y2="512" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Work/Rest indicator dots -->
  <circle cx="512" cy="180" r="8" fill="#FF6B35"/>
  <circle cx="512" cy="200" r="8" fill="#4CAF50"/>
  <circle cx="512" cy="220" r="8" fill="#FF6B35"/>
  <circle cx="512" cy="240" r="8" fill="#4CAF50"/>
  
  <!-- Small fitness icon (dumbbell) -->
  <g transform="translate(450, 600)">
    <!-- Dumbbell bar -->
    <rect x="0" y="40" width="120" height="8" fill="#FFFFFF" rx="4"/>
    <!-- Left weight -->
    <rect x="-20" y="20" width="20" height="48" fill="#FFFFFF" rx="4"/>
    <!-- Right weight -->
    <rect x="120" y="20" width="20" height="48" fill="#FFFFFF" rx="4"/>
  </g>
</svg>
