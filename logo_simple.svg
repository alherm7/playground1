<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6750A4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)"/>
  
  <!-- Timer circle -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#FFFFFF" stroke-width="32"/>
  
  <!-- Timer hands -->
  <!-- Hour hand (shorter) -->
  <line x1="512" y1="512" x2="512" y2="280" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <!-- Minute hand (longer) -->
  <line x1="512" y1="512" x2="512" y2="200" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="512" cy="512" r="24" fill="#FFFFFF"/>
  
  <!-- Timer marks (12, 3, 6, 9 o'clock) -->
  <line x1="512" y1="120" x2="512" y2="180" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="904" y1="512" x2="844" y2="512" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="512" y1="904" x2="512" y2="844" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="120" y1="512" x2="180" y2="512" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Work/Rest indicator -->
  <circle cx="512" cy="180" r="12" fill="#FF6B35"/>
  <circle cx="512" cy="200" r="12" fill="#4CAF50"/>
</svg>
